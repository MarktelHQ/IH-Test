<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DATA UNIT — what they actually do all day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16233A;
    --ink-soft:#4A5A76;
    --page:#E7ECF1;
    --panel:#FFFFFF;
    --line:#C6D0DC;
    --tape:#FFB100;
    --pipe:#12776E;
    --r:14px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--page);color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:17px;line-height:1.55;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px}
  h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:800;letter-spacing:-0.02em;line-height:1.05;margin:0}
  p{margin:0 0 0.9em}
  :focus-visible{outline:3px solid var(--tape);outline-offset:3px;border-radius:4px}

  /* ---------- masthead ---------- */
  header.top{background:var(--ink);color:#fff;padding:30px 0 30px}
  .toprow{display:flex;align-items:flex-start;gap:16px;margin-bottom:14px}
  header.top .kicker{font-size:14px;color:#9DB0CC;margin:0;font-weight:500;flex:1}
  header.top h1{font-size:clamp(32px,6.2vw,58px);color:#fff;max-width:16ch}
  header.top h1 em{font-style:normal;color:var(--tape)}
  header.top .sub{margin:16px 0 0;max-width:52ch;color:#C6D3E6}

  .lang{display:flex;gap:2px;background:#1E2E4A;border:1px solid #33486B;border-radius:999px;padding:3px;flex:0 0 auto}
  .lang button{
    font:inherit;font-weight:600;font-size:13px;cursor:pointer;border:none;background:transparent;
    color:#9DB0CC;padding:6px 15px;border-radius:999px;letter-spacing:.03em;
  }
  .lang button[aria-pressed="true"]{background:var(--tape);color:#2A1D00}

  /* ---------- pipeline ---------- */
  .rig{background:var(--ink);padding:0 0 44px}
  .track{background:#1E2E4A;border:1px solid #2F4364;border-radius:var(--r);padding:22px 18px 18px;position:relative;overflow:hidden}
  .track-label{font-size:13px;color:#8FA5C6;margin:0 0 18px}
  .stations{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .stn{
    min-width:0;background:#16233A;border:1px solid #33486B;border-radius:10px;
    padding:12px 8px;text-align:center;cursor:pointer;
    transition:background .2s,border-color .2s,transform .2s;
  }
  .stn .icon{font-size:22px;line-height:1;display:block;margin-bottom:8px;filter:grayscale(1) opacity(.55)}
  .stn .en{display:block;font-size:12.5px;font-weight:600;color:#DCE6F5;line-height:1.25}
  .stn .de{display:block;font-size:11px;color:#7C93B8;margin-top:3px}
  .stn.live{background:var(--tape);border-color:var(--tape);transform:translateY(-4px)}
  .stn.live .icon{filter:none}
  .stn.live .en{color:#2A1D00}
  .stn.live .de{color:#6B4E00}
  .stn.done{border-color:var(--pipe);background:#123A3F}
  .stn.done .icon{filter:none;opacity:.9}

  .readout{margin-top:16px;background:#101B2E;border:1px dashed #3A5178;border-radius:10px;padding:14px 16px;min-height:82px;color:#DCE6F5;font-size:15px}
  .readout b{color:var(--tape);font-weight:600}
  .readout .who{display:block;font-size:12px;color:#8FA5C6;margin-bottom:5px}

  .controls{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button.act{font:inherit;font-weight:600;font-size:15px;cursor:pointer;background:var(--tape);color:#2A1D00;border:none;border-radius:999px;padding:11px 22px}
  button.act:hover{background:#FFC33D}
  button.ghost{font:inherit;font-size:14px;cursor:pointer;background:transparent;color:#B7C8E2;border:1px solid #3A5178;border-radius:999px;padding:10px 18px}
  button.ghost:hover{border-color:#7C93B8;color:#fff}
  .counter{font-size:13px;color:#8FA5C6;margin-left:auto}

  /* ---------- sections ---------- */
  section{padding:52px 0 8px}
  section h2{font-size:clamp(24px,4vw,34px);margin-bottom:8px}
  section h2 .hi{font-size:0.82em;margin-right:10px;vertical-align:-0.04em}
  section .lede{color:var(--ink-soft);max-width:60ch;margin-bottom:26px}
  .aside{color:var(--ink-soft);max-width:60ch;margin-top:22px;font-size:15px}

  /* ---------- before/after ---------- */
  .switcher{display:flex;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:4px;width:fit-content;margin-bottom:20px}
  .switcher button{font:inherit;font-weight:600;font-size:14.5px;cursor:pointer;border:none;background:transparent;color:var(--ink-soft);padding:9px 20px;border-radius:999px}
  .switcher button[aria-selected="true"]{background:var(--ink);color:#fff}
  .compare{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px}
  .compare h3{font-size:20px;margin-bottom:12px}
  .compare ul{margin:0;padding-left:0;list-style:none}
  .compare li{margin-bottom:10px}
  .chaos h3{color:#C8102E}
  .order h3{color:var(--pipe)}

  /* ---------- flip cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .flip{perspective:1000px;height:262px;cursor:pointer}
  .flip .inner{position:relative;display:block;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.8,.25,1);transform-style:preserve-3d}
  .flip[aria-pressed="true"] .inner{transform:rotateY(180deg)}
  .face{
    position:absolute;top:0;left:0;width:100%;height:100%;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:var(--r);padding:18px;display:flex;flex-direction:column;overflow:hidden;
  }
  .face.front{background:var(--panel);border:1px solid var(--line)}
  .face.back{background:var(--ink);color:#DCE6F5;transform:rotateY(180deg);border:1px solid var(--ink)}
  .face .ico{font-size:28px;line-height:1;margin-bottom:12px}
  .face .term{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:21px;letter-spacing:-0.02em;line-height:1.15}
  .face .said{font-size:12.5px;color:var(--ink-soft);margin-top:6px}
  .face .hint{margin-top:auto;font-size:12.5px;color:#8494AF;padding-top:10px}
  .face.back .body{font-size:14.5px;line-height:1.5}
  .face.back .note{margin-top:auto;font-size:12.5px;color:#8FA5C6;padding-top:12px}
  .flip.hot .face.front{border-color:var(--tape);border-width:2px}
  .flip.hot .face.front .term::after{content:"★";color:var(--tape);font-size:14px;margin-left:6px;vertical-align:super}
  .flip.ref{height:278px}
  .flip.ref .face.front{border-left:5px solid var(--pipe)}
  .flip.ref .face.back{background:var(--pipe);border-color:var(--pipe);color:#F0FAF8}
  .flip.ref .face.back .note{color:#B9E0DA;border-top:1px solid rgba(255,255,255,.22)}

  /* ---------- roles ---------- */
  .roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
  .role{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;border-left:5px solid var(--pipe)}
  .role .ri{font-size:26px;line-height:1;display:block;margin-bottom:10px}
  .role h3{font-size:19px;margin-bottom:2px}
  .role .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px}
  .role p.body{font-size:15px;margin-bottom:10px}
  .role .day{font-size:13.5px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:10px;margin:0}
  .role .day b{color:var(--ink);font-weight:600}

  /* ---------- facts ---------- */
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .fact{background:var(--panel);padding:20px 18px}
  .fact .fi{font-size:22px;line-height:1;display:block;margin-bottom:10px}
  .fact .n{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:32px;letter-spacing:-0.03em;line-height:1}
  .fact .l{font-size:13.5px;color:var(--ink-soft);margin-top:7px}

  /* ---------- checklist ---------- */
  .list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .item{border-bottom:1px solid var(--line)}
  .item:last-of-type{border-bottom:none}
  .item button{font:inherit;text-align:left;cursor:pointer;background:none;border:none;color:inherit;padding:15px 18px;width:100%;display:flex;gap:13px;align-items:flex-start;font-size:15.5px}
  .item button:hover{background:#F2F6FA}
  .box{flex:0 0 22px;width:22px;height:22px;border:2px solid var(--line);border-radius:6px;margin-top:1px;display:grid;place-items:center;font-size:14px;color:transparent;transition:.15s}
  .item button[aria-pressed="true"] .box{background:var(--pipe);border-color:var(--pipe);color:#fff}
  .item button[aria-pressed="true"] .txt{color:var(--ink-soft);text-decoration:line-through}
  .progress{padding:13px 18px;font-size:14px;color:var(--ink-soft);background:#F2F6FA;border-top:1px solid var(--line)}

  /* ---------- quiz ---------- */
  .quiz{background:var(--ink);border-radius:var(--r);padding:26px;color:#DCE6F5}
  .quiz h2{color:#fff}
  .quiz .lede{color:#9DB0CC}
  .q{border-top:1px solid #2F4364;padding:20px 0 4px}
  .q:first-of-type{border-top:none}
  .q .prompt{font-weight:600;color:#fff;margin-bottom:12px;font-size:16.5px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opts button{font:inherit;font-size:15px;text-align:left;cursor:pointer;background:#1E2E4A;border:1px solid #33486B;color:#DCE6F5;border-radius:9px;padding:11px 15px}
  .opts button:hover:not(:disabled){border-color:#7C93B8}
  .opts button:disabled{cursor:default}
  .opts button.right{background:#12776E;border-color:#12776E;color:#fff}
  .opts button.wrong{background:#4A1F26;border-color:#8A3644;color:#F3C9CF}
  .why{font-size:14.5px;color:#9DB0CC;margin:11px 0 0}
  .score{margin-top:22px;padding-top:18px;border-top:1px solid #2F4364;font-size:16px;color:#fff;font-weight:600}

  footer{padding:44px 0 60px;color:var(--ink-soft);font-size:14px}
  footer p{max-width:62ch}

  @media (max-width:760px){ .stations{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:680px){
    body{font-size:16px}
    .wrap{padding:0 16px}
    header.top{padding:24px 0 26px}
    section{padding:42px 0 6px}
    .track{padding:18px 14px 16px}
    .stn{padding:10px 6px}
    .stn .icon{font-size:19px;margin-bottom:5px}
    .stn .en{font-size:12px}
    .stn .de{font-size:10.5px}
    .compare{padding:18px}
    .quiz{padding:20px 18px}
    .controls button.act,.controls button.ghost{flex:1 1 100%;text-align:center}
    .counter{margin:2px 0 0;width:100%;text-align:center}
    .switcher{width:100%}
    .switcher button{flex:1;padding:9px 8px;font-size:13.5px}
    .item button{padding:14px 15px;font-size:15px}
    .fact .n{font-size:27px}
  }
  @media (max-width:440px){
    .stations{grid-template-columns:repeat(2,1fr)}
    .flip{height:292px}
    .flip.ref{height:316px}
    header.top h1{max-width:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation-duration:.01ms !important}
    .flip .inner{transition:none}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="toprow">
      <p class="kicker" id="kicker"></p>
      <div class="lang" role="group" aria-label="Language / Sprache">
        <button type="button" id="lang-en" aria-pressed="true">EN</button>
        <button type="button" id="lang-de" aria-pressed="false">DE</button>
      </div>
    </div>
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>
  </div>
</header>

<div class="rig">
  <div class="wrap">
    <div class="track">
      <p class="track-label" id="trackLabel"></p>
      <div class="stations" id="stations"></div>
      <div class="readout" id="readout" role="status" aria-live="polite"></div>
      <div class="controls">
        <button class="act" id="go"></button>
        <button class="ghost" id="reset"></button>
        <span class="counter" id="counter"></span>
      </div>
    </div>
  </div>
</div>

<main class="wrap">

<section>
  <h2><span class="hi" aria-hidden="true">🧩</span><span id="s1t"></span></h2>
  <p class="lede" id="s1l"></p>
  <div class="switcher" role="tablist">
    <button role="tab" id="tab-a" aria-selected="true" aria-controls="pane"></button>
    <button role="tab" id="tab-b" aria-selected="false" aria-controls="pane"></button>
  </div>
  <div class="compare chaos" id="pane" role="tabpanel" aria-labelledby="tab-a"></div>
</section>

<section>
  <h2><span class="hi" aria-hidden="true">💬</span><span id="s2t"></span></h2>
  <p class="lede" id="s2l"></p>
  <div class="grid" id="cards"></div>
</section>

<section>
  <h2><span class="hi" aria-hidden="true">🔍</span><span id="s3t"></span></h2>
  <p class="lede" id="s3l"></p>
  <div class="grid" id="refs"></div>
  <p class="aside" id="s3n"></p>
</section>

<section>
  <h2><span class="hi" aria-hidden="true">🪑</span><span id="s4t"></span></h2>
  <p class="lede" id="s4l"></p>
  <div class="roles" id="roles"></div>
</section>

<section>
  <h2><span class="hi" aria-hidden="true">📊</span><span id="s5t"></span></h2>
  <p class="lede" id="s5l"></p>
  <div class="facts" id="facts"></div>
</section>

<section>
  <h2><span class="hi" aria-hidden="true">✅</span><span id="s6t"></span></h2>
  <p class="lede" id="s6l"></p>
  <div class="list" id="checklist"></div>
</section>

<section>
  <div class="quiz">
    <h2><span class="hi" aria-hidden="true">🎯</span><span id="s7t"></span></h2>
    <p class="lede" id="s7l"></p>
    <div id="quiz"></div>
    <div class="score" id="score" aria-live="polite"></div>
  </div>
</section>

<footer><p id="foot"></p></footer>

</main>

<script>
(function(){

/* ==================== CONTENT ==================== */
var T = {};

T.en = {
  htmlLang:'en',
  kicker:'Before your day at DATA UNIT AG · Sursee &amp; Baden',
  h1:'They build the <em>invisible machine</em> a company runs on.',
  sub:'Nobody outside the company ever sees it. But if it stops, nothing gets sold, shipped or paid for. Here\u2019s how it works — press the button.',
  trackLabel:'A customer orders 200 screws from a Swiss factory. Watch what has to happen.',
  readyWho:'Ready',
  ready:'Six different departments. Six different people. They all need to know the same thing at the same time — and none of them wants to phone the others.',
  doneWho:'That was one order',
  done:'Six departments, one shared set of facts. That shared set of facts is the ERP system. <b>Selling it, setting it up and keeping it alive is DATA UNIT\u2019s entire business.</b>',
  goStart:'Start: the order arrives', goNext:'Next step', goFinal:'And finally…', goAgain:'Run it again',
  reset:'Start again', cIdle:'6 steps', cStep:'Step {n} of {t}', cDone:'Finished',
  stations:['Order comes in','Check the stock','Make what\u2019s missing','Pack and ship','Send the bill','Did we make money?'],
  steps:[
    {who:'Sales', txt:'A customer emails: <b>200 screws, needed Friday</b>. Sales types the order into the system once. That\u2019s the last time anyone types it.'},
    {who:'Warehouse', txt:'The system already knows there are <b>only 120 screws</b> on the shelf. It reserves those and flags the gap — before anyone promises a date they can\u2019t keep.'},
    {who:'Production', txt:'An order for the missing <b>80 screws</b> appears on the factory floor\u2019s screen. Nobody had to phone anybody.'},
    {who:'Shipping', txt:'All 200 are ready. The system prints the delivery note and the label with <b>the right address</b>, because it\u2019s the same address sales typed on Monday.'},
    {who:'Accounting', txt:'The invoice writes itself from the delivery. Right price, right customer, right day. <b>No typing, no typos.</b>'},
    {who:'Management', txt:'The boss opens a screen and sees what these 200 screws cost, what they sold for, and <b>whether it was worth doing</b>. That\u2019s the whole point.'}
  ],

  s1t:'So what is DATA UNIT\u2019s job?',
  s1l:'That whole chain above is run by one big piece of software called an <strong>ERP system</strong>. DATA UNIT doesn\u2019t invent it — a giant German company called <strong>SAP</strong> does. DATA UNIT are the people who install it, bend it into the shape a particular business needs, and keep it running afterwards.',
  tabA:'Company without an ERP', tabB:'Same company with one',
  chaosTitle:'Everyone keeps their own list',
  chaos:[
    '📊 Sales writes orders in <b>Excel</b>. The warehouse keeps a paper folder. Accounting has a third list.',
    '😬 Somebody sells 200 screws that were already promised to another customer yesterday.',
    '📞 A customer phones asking where their delivery is. Four people get asked. Nobody knows.',
    '🧮 At the end of the month, working out whether the company actually made money takes a week.',
    '🗺️ Every new employee has to learn where all the secret lists live.'
  ],
  orderTitle:'One shared set of facts',
  order:[
    '✍️ The order is typed in <b>once</b>. Everyone else reads the same entry.',
    '📦 Stock updates itself the second something is picked, so nothing gets sold twice.',
    '⚡ Anyone can answer "where is my delivery?" in about five seconds.',
    '💰 Profit for the month is a screen, not a week of work.',
    '🎒 New employee? They learn one system instead of twelve secret folders.'
  ],

  s2t:'Words you\u2019ll hear on the day',
  s2l:'Tap a card to flip it. The starred ones are the four that come up constantly — if you only remember four, remember those.',
  tapFind:'Tap to find out', tapAnswer:'Tap for the answer',
  terms:[
    {t:'ERP', s:'"ee-ar-pee"', hot:1, b:'Enterprise Resource Planning. One giant program that runs everything a company does — orders, stock, production, invoices, staff, money — out of one shared database. It is the thing DATA UNIT sells.', n:'German: same word. Everyone says "das ERP".'},
    {t:'SAP', s:'say the letters: "ess-ay-pee"', hot:1, b:'A German software giant, founded 1972, one of the biggest software companies on earth. SAP writes the ERP software. DATA UNIT is an official partner who installs and adapts it for Swiss companies.', n:'Never say "sapp". Locals say "ess-ah-peh".'},
    {t:'SAP Business One', s:'often shortened to "B1"', hot:1, b:'The version of SAP built for smaller companies — say 10 to 300 people. This is DATA UNIT\u2019s bread and butter. If you hear "B1", this is it.', n:'"Business One" or just "B-eins".'},
    {t:'S/4HANA', s:'"ess-four-hah-nah"', hot:1, b:'SAP\u2019s newer, bigger ERP. HANA is the super-fast database underneath it. The "Cloud Public Edition" runs in SAP\u2019s own data centres, so the customer needs no server of their own.', n:'Often just called "S/4".'},
    {t:'KMU', s:'"kah-em-oo"', b:'Kleine und mittlere Unternehmen — small and medium-sized businesses. Almost every Swiss company is one. These are DATA UNIT\u2019s customers.', n:'English equivalent: SME.'},
    {t:'Cloud vs. On-Premise', s:'', b:'Cloud = the software runs on somebody else\u2019s computers, reached over the internet. On-Premise = it runs on a server in the customer\u2019s own building. DATA UNIT does both, and is moving customers toward cloud.', n:'German: "in der Cloud" / "im Haus".'},
    {t:'Implementation', s:'', b:'The months-long project of switching a company onto a new ERP: setting it up, moving the old data across, training everyone, then going live. The riskiest and most interesting part of the job.', n:'German: Einführung or Implementierung.'},
    {t:'Go-live', s:'', b:'The day the new system is switched on for real and the old one is switched off. Usually a weekend. Usually a bit tense. Usually followed by pizza.', n:'Same word in German.'},
    {t:'Interface', s:'', b:'A connection that lets two different programs talk to each other — for example the webshop telling the ERP that something was sold. DATA UNIT builds a lot of these; it\u2019s one of the things they\u2019re known for.', n:'German: Schnittstelle. You will hear this word a LOT.'},
    {t:'EDI', s:'"ee-dee-eye"', b:'Electronic Data Interchange. Big customers like Migros or Coop don\u2019t email orders — their computer sends them straight into the supplier\u2019s computer in an agreed format. EDI is that plumbing.', n:'Same abbreviation in German.'},
    {t:'Database', s:'', b:'The place all the facts actually live — every customer, product, price and order, stored in enormous tables. Everything else on this page is just a nicer way of looking at the database.', n:'German: Datenbank.'},
    {t:'Ticket', s:'', b:'When a customer reports a problem it becomes a numbered ticket. Support works through them. "Wie viele Tickets hast du heute?" is normal small talk here.', n:'Same word in German.'},
    {t:'Customising', s:'', b:'Changing settings inside SAP so it fits one particular company — no new code, just choices. Different from development, and consultants are quick to point that out.', n:'German: Customizing, said the English way.'},
    {t:'Migration', s:'', b:'Moving all the old data — thousands of customers and products — from the old system into the new one without losing or scrambling any of it. Boring-sounding, genuinely hard.', n:'German: Datenmigration.'},
    {t:'Lehre / Apprenticeship', s:'', b:'In Switzerland most people in this building learned the job by doing a 4-year Lehre, often as Informatiker EFZ Applikationsentwicklung, while going to school part-time. Ask someone about theirs.', n:'Your day here is a Schnuppertag.'}
  ],

  s3t:'Who actually uses this stuff',
  s3l:'No Galaxus, sorry — companies that big write their own systems. DATA UNIT works with Swiss firms of roughly 10 to 300 people, which sounds boring until you find out what they make. Guess before you flip.',
  s3n:'These come from case studies DATA UNIT and SAP have published. Some are a few years old, so a couple of details may have moved on — which is itself a decent thing to ask about.',

var termIcons = ['🧠','🇩🇪','1️⃣','⚡','🏘️','☁️','🏗️','🚦','🔌','📡','🗄️','🎫','🎛️','📤','🎓'];
var refIcons  = ['🛰️','📺','🚲','🧯','🤖','🪠'];
var roleIcons = ['🧭','⌨️','🗓️','🎧','🤝'];
var factIcons = ['🕰️','👥','🏢','🇨🇭','📦','💬'];

var at = -1;                 // pipeline position
var showOrder = false;       // before/after tab
var flipped = {};            // card id -> bool
var checked = [];            // checklist state
var picked = [];             // quiz answers (index or null)

function $(id){ return document.getElementById(id); }
function fill(id, html){ $(id).innerHTML = html; }
function tpl(s, o){ return s.replace(/\{(\w+)\}/g, function(_, k){ return o[k]; }); }

/* ==================== PIPELINE ==================== */
function renderStations(){
  var box = $('stations');
  box.innerHTML = '';
  L.stations.forEach(function(label, i){
    var other = (lang === 'en' ? T.de : T.en).stations[i];
    var d = document.createElement('div');
    d.className = 'stn';
    d.innerHTML = '<span class="icon" aria-hidden="true">' + stationIcons[i] + '</span>' +
                  '<span class="en">' + label + '</span>' +
                  '<span class="de">' + other + '</span>';
    d.addEventListener('click', function(){ at = i; paintPipeline(); });
    box.appendChild(d);
  });
}
function paintPipeline(){
  var stns = $('stations').children;
  for(var n = 0; n < stns.length; n++){
    stns[n].classList.toggle('live', n === at);
    stns[n].classList.toggle('done', at >= L.steps.length ? true : n < at);
  }
  if(at < 0){
    fill('readout', '<span class="who">' + L.readyWho + '</span>' + L.ready);
    $('go').textContent = L.goStart;
    $('counter').textContent = L.cIdle;
  } else if(at >= L.steps.length){
    fill('readout', '<span class="who">' + L.doneWho + '</span>' + L.done);
    $('go').textContent = L.goAgain;
    $('counter').textContent = L.cDone;
  } else {
    fill('readout', '<span class="who">' + L.steps[at].who + '</span>' + L.steps[at].txt);
    $('go').textContent = (at === L.steps.length - 1) ? L.goFinal : L.goNext;
    $('counter').textContent = tpl(L.cStep, {n: at + 1, t: L.steps.length});
  }
  $('reset').textContent = L.reset;
}
$('go').addEventListener('click', function(){
  if(at >= L.steps.length) at = -1;
  at++;
  paintPipeline();
});
$('reset').addEventListener('click', function(){ at = -1; paintPipeline(); });

/* ==================== BEFORE / AFTER ==================== */
function renderCompare(){
  $('tab-a').textContent = L.tabA;
  $('tab-b').textContent = L.tabB;
  $('tab-a').setAttribute('aria-selected', showOrder ? 'false' : 'true');
  $('tab-b').setAttribute('aria-selected', showOrder ? 'true' : 'false');
  var title = showOrder ? L.orderTitle : L.chaosTitle;
  var items = showOrder ? L.order : L.chaos;
  var pane = $('pane');
  pane.className = 'compare ' + (showOrder ? 'order' : 'chaos');
  pane.setAttribute('aria-labelledby', showOrder ? 'tab-b' : 'tab-a');
  pane.innerHTML = '<h3>' + title + '</h3><ul>' +
    items.map(function(i){ return '<li>' + i + '</li>'; }).join('') + '</ul>';
}
$('tab-a').addEventListener('click', function(){ showOrder = false; renderCompare(); });
$('tab-b').addEventListener('click', function(){ showOrder = true; renderCompare(); });

/* ==================== FLIP CARDS ==================== */
function buildCard(x, extra, icon, key){
  var el = document.createElement('div');
  el.className = 'flip' + extra + (x.hot ? ' hot' : '');
  el.setAttribute('role','button');
  el.setAttribute('tabindex','0');
  el.setAttribute('aria-pressed', flipped[key] ? 'true' : 'false');
  el.innerHTML =
    '<div class="inner">' +
      '<div class="face front">' +
        '<div class="ico" aria-hidden="true">' + icon + '</div>' +
        '<div class="term">' + x.t + '</div>' +
        (x.s ? '<div class="said">' + x.s + '</div>' : '') +
        '<div class="hint">' + (extra ? L.tapAnswer : L.tapFind) + '</div>' +
      '</div>' +
      '<div class="face back">' +
        '<div class="body">' + x.b + '</div>' +
        '<div class="note">' + x.n + '</div>' +
      '</div>' +
    '</div>';
  function toggle(){
    flipped[key] = !flipped[key];
    el.setAttribute('aria-pressed', flipped[key] ? 'true' : 'false');
  }
  el.addEventListener('click', toggle);
  el.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){ e.preventDefault(); toggle(); }
  });
  return el;
}
function renderCards(){
  var c = $('cards'); c.innerHTML = '';
  L.terms.forEach(function(x, i){ c.appendChild(buildCard(x, '', termIcons[i], 't' + i)); });
  var r = $('refs'); r.innerHTML = '';
  L.refs.forEach(function(x, i){ r.appendChild(buildCard(x, ' ref', refIcons[i], 'r' + i)); });
}

/* ==================== ROLES & FACTS ==================== */
function renderRoles(){
  var box = $('roles'); box.innerHTML = '';
  L.roles.forEach(function(x, i){
    var d = document.createElement('div');
    d.className = 'role';
    d.innerHTML = '<span class="ri" aria-hidden="true">' + roleIcons[i] + '</span>' +
      '<h3>' + x.t + '</h3><p class="sub">' + x.sub + '</p>' +
      '<p class="body">' + x.b + '</p>' +
      '<p class="day"><b>' + L.dayLabel + '</b> ' + x.d + '</p>';
    box.appendChild(d);
  });
}
function renderFacts(){
  var box = $('facts'); box.innerHTML = '';
  L.facts.forEach(function(x, i){
    var d = document.createElement('div');
    d.className = 'fact';
    d.innerHTML = '<span class="fi" aria-hidden="true">' + factIcons[i] + '</span>' +
      '<div class="n">' + x.n + '</div><div class="l">' + x.l + '</div>';
    box.appendChild(d);
  });
}

/* ==================== CHECKLIST ==================== */
function renderChecklist(){
  var box = $('checklist'); box.innerHTML = '';
  if(checked.length !== L.todo.length) checked = L.todo.map(function(){ return false; });
  var prog = document.createElement('div');
  prog.className = 'progress';
  function upd(){
    var d = checked.filter(Boolean).length;
    prog.textContent = tpl(L.progress, {d: d, t: L.todo.length});
  }
  L.todo.forEach(function(t, i){
    var row = document.createElement('div'); row.className = 'item';
    var b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-pressed', checked[i] ? 'true' : 'false');
    b.innerHTML = '<span class="box" aria-hidden="true">✓</span><span class="txt">' + t + '</span>';
    b.addEventListener('click', function(){
      checked[i] = !checked[i];
      b.setAttribute('aria-pressed', checked[i] ? 'true' : 'false');
      upd();
    });
    row.appendChild(b); box.appendChild(row);
  });
  upd(); box.appendChild(prog);
}

/* ==================== QUIZ ==================== */
function scoreText(){
  var ans = picked.filter(function(v){ return v !== null && v !== undefined; }).length;
  if(!ans) return L.sIdle;
  var right = 0;
  picked.forEach(function(v, i){ if(v === L.quiz[i].a) right++; });
  if(ans < L.quiz.length) return tpl(L.sMid, {r: right, a: ans});
  return tpl(L.sFinal, {r: right, t: L.quiz.length}) + (right === L.quiz.length ? L.sWin : L.sLose);
}
function renderQuiz(){
  var box = $('quiz'); box.innerHTML = '';
  if(picked.length !== L.quiz.length) picked = L.quiz.map(function(){ return null; });
  L.quiz.forEach(function(q, qi){
    var wrapEl = document.createElement('div'); wrapEl.className = 'q';
    var p = document.createElement('div'); p.className = 'prompt';
    p.textContent = (qi + 1) + '. ' + q.p;
    var opts = document.createElement('div'); opts.className = 'opts';
    var why = document.createElement('p'); why.className = 'why';
    q.o.forEach(function(text, oi){
      var b = document.createElement('button'); b.type = 'button'; b.textContent = text;
      b.addEventListener('click', function(){
        if(picked[qi] !== null) return;
        picked[qi] = oi;
        lockQ();
      });
      opts.appendChild(b);
    });
    function lockQ(){
      if(picked[qi] === null) return;
      var all = opts.querySelectorAll('button');
      Array.prototype.forEach.call(all, function(x){ x.disabled = true; });
      all[q.a].classList.add('right');
      if(picked[qi] !== q.a) all[picked[qi]].classList.add('wrong');
      why.textContent = q.w;
      $('score').textContent = scoreText();
    }
    wrapEl.appendChild(p); wrapEl.appendChild(opts); wrapEl.appendChild(why);
    box.appendChild(wrapEl);
    lockQ();
  });
  $('score').textContent = scoreText();
}

/* ==================== RENDER ALL ==================== */
function render(){
  L = T[lang];
  document.documentElement.setAttribute('lang', L.htmlLang);
  fill('kicker', L.kicker); fill('h1', L.h1); fill('sub', L.sub);
  fill('trackLabel', L.trackLabel);
  fill('s1t', L.s1t); fill('s1l', L.s1l);
  fill('s2t', L.s2t); fill('s2l', L.s2l);
  fill('s3t', L.s3t); fill('s3l', L.s3l); fill('s3n', L.s3n);
  fill('s4t', L.s4t); fill('s4l', L.s4l);
  fill('s5t', L.s5t); fill('s5l', L.s5l);
  fill('s6t', L.s6t); fill('s6l', L.s6l);
  fill('s7t', L.s7t); fill('s7l', L.s7l);
  fill('foot', L.foot);
  renderStations(); paintPipeline();
  renderCompare(); renderCards(); renderRoles();
  renderFacts(); renderChecklist(); renderQuiz();
  $('lang-en').setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');
  $('lang-de').setAttribute('aria-pressed', lang === 'de' ? 'true' : 'false');
}
function setLang(l){ if(l === lang) return; lang = l; render(); }
$('lang-en').addEventListener('click', function(){ setLang('en'); });
$('lang-de').addEventListener('click', function(){ setLang('de'); });

render();

})();
</script>
</body>
</html>
