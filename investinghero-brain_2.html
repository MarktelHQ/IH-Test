<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InvestingHero — project brain</title>
<style>
  :root{
    --bg:#0B0718;
    --bg2:#120A2B;
    --hair:rgba(160,150,205,.13);
    --hair2:rgba(160,150,205,.07);
    --ink:#EDE9F7;
    --muted:#9A92B8;
    --muted2:#6B6489;
    --accent:#00DF56;
    --panel:rgba(18,10,43,.86);
    --line:rgba(160,150,205,.18);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  body.light{
    --bg:#F6F7F8; --bg2:#EDEEF3;
    --hair:rgba(31,14,69,.14); --hair2:rgba(31,14,69,.07);
    --ink:#1D1D1D; --muted:#5D5D66; --muted2:#8A8A96;
    --accent:#0A7C3C;
    --panel:rgba(255,255,255,.92);
    --line:rgba(31,14,69,.16);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(120% 120% at 50% 45%, var(--bg2) 0%, var(--bg) 62%);
    color:var(--ink); font-family:var(--sans); overflow:hidden;
  }
  #map{width:100vw;height:100vh;display:block;cursor:grab}
  #map.drag{cursor:grabbing}

  .node{cursor:pointer}
  .node circle{transition:r .12s ease, opacity .12s ease}
  text{user-select:none}

  .glabel{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;fill:var(--muted2)}
  .dlabel{font-family:var(--mono);font-size:12px;letter-spacing:.26em;text-transform:uppercase}
  .hublabel{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;fill:var(--muted)}
  .corelabel{font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;fill:var(--ink)}
  .coresub{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;fill:var(--muted2)}

  /* HUD */
  .hud{position:fixed;top:16px;right:16px;width:270px;z-index:5}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;backdrop-filter:blur(9px)}
  .lab{font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted2);margin:10px 2px 6px}
  .lab:first-child{margin-top:2px}
  input[type=search]{
    width:100%;background:transparent;border:1px solid var(--line);border-radius:9px;color:var(--ink);
    font-family:var(--mono);font-size:11.5px;padding:8px 10px;outline:none
  }
  input[type=search]:focus-visible{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,223,86,.18)}
  .seg{display:flex;gap:5px;flex-wrap:wrap}
  .seg button, .chip{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:7px;padding:5px 8px;cursor:pointer
  }
  .seg button.on{color:var(--ink);border-color:var(--muted);background:rgba(150,140,200,.09)}
  .seg button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .chips{display:flex;flex-direction:column;gap:4px}
  .chip{display:flex;align-items:center;gap:7px;text-align:left;width:100%}
  .chip .sw{width:7px;height:7px;border-radius:2px;flex:none}
  .chip .ct{margin-left:auto;color:var(--muted2)}
  .chip.off{opacity:.35}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 2px;
       font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  input[type=range]{width:110px;accent-color:var(--accent);background:transparent}
  input[type=checkbox]{accent-color:var(--accent)}

  #results{margin-top:6px;max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:9px;display:none}
  #results button{
    display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--hair2);
    color:var(--ink);font-family:var(--mono);font-size:10.5px;padding:7px 9px;cursor:pointer
  }
  #results button:hover{background:rgba(150,140,200,.12)}
  #results .p{color:var(--muted2);font-size:9px}

  /* panel */
  #panel{
    position:fixed;top:16px;left:16px;width:340px;max-height:calc(100vh - 32px);overflow:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px 18px;
    backdrop-filter:blur(9px);display:none;z-index:6
  }
  #panel h2{font-size:15px;margin:0 0 2px;line-height:1.3;letter-spacing:-.01em}
  #panel .eyebrow{font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted2);margin-bottom:8px}
  #panel .meta{font-family:var(--mono);font-size:10px;color:var(--muted);margin:9px 0;line-height:1.7;word-break:break-word}
  #panel p.note{font-size:12.5px;line-height:1.62;color:var(--ink);opacity:.9;margin:10px 0 0}
  #panel a{color:var(--accent);font-family:var(--mono);font-size:10.5px;text-decoration:none}
  #panel a:hover{text-decoration:underline}
  #panel .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:11px}
  #panel .tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:5px;padding:3px 6px;color:var(--muted)}
  #close{position:absolute;top:11px;right:11px;background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:15px;line-height:1}
  hr.sep{border:0;border-top:1px solid var(--hair);margin:13px 0}
  .gap{width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--hair);
       padding:11px 2px;cursor:pointer;color:var(--ink);display:block}
  .gap:first-of-type{border-top:0}
  .gap:hover{background:rgba(150,140,200,.09)}
  .gap.on{background:rgba(0,223,86,.07)}
  .gap h3{margin:0;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:baseline}
  .gap .n{font-family:var(--mono);font-size:9.5px;color:var(--accent);margin-left:auto}
  .gap .why{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);margin:5px 0 0}
  .gap .what{font-size:11.5px;line-height:1.55;color:var(--muted);margin:6px 0 0}
  .back{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
        background:transparent;border:0;padding:0 0 9px;cursor:pointer}
  .back:hover{color:var(--accent)}

  #tip{
    position:fixed;pointer-events:none;z-index:9;display:none;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 9px;backdrop-filter:blur(6px);
    font-family:var(--mono);font-size:10px;color:var(--ink);max-width:260px
  }
  #tip .s{display:block;color:var(--muted2);font-size:9px;margin-top:3px}

  .proxlabel{font-family:var(--mono);font-size:8px;letter-spacing:.04em;fill:var(--muted);pointer-events:none}
  .rellabel{font-family:var(--mono);font-size:9px;letter-spacing:.06em;fill:var(--ink);pointer-events:none}

  #readout{
    position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:5;
    width:min(720px,calc(100vw - 620px));min-width:340px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;
    backdrop-filter:blur(9px);display:none
  }
  #readout .rname{font-size:13px;font-weight:600;line-height:1.25;display:flex;gap:9px;align-items:baseline}
  #readout .rpath{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2);margin-left:auto;white-space:nowrap}
  #readout .rnote{font-size:11.5px;line-height:1.5;color:var(--muted);margin:5px 0 0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #readout .rbits{font-family:var(--mono);font-size:9px;color:var(--muted2);margin-top:6px;letter-spacing:.06em}
  #readout b.hot{color:var(--accent)}

  .relchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;
    border:1px solid var(--line);border-radius:6px;padding:4px 7px;margin:0 4px 4px 0;color:var(--muted);
    background:transparent;cursor:pointer;text-align:left}
  .relchip:hover{color:var(--ink);border-color:var(--muted)}
  .relchip .sw{width:6px;height:6px;border-radius:2px;flex:none}
  .sibnav{display:flex;gap:5px;margin-top:12px}
  .sibnav button{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
    background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--muted);padding:5px 9px;cursor:pointer}
  .sibnav button:hover{color:var(--ink)}
  .brandmark{position:fixed;left:16px;bottom:14px;font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted2);z-index:4}
  .hintbar{position:fixed;right:16px;bottom:14px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);z-index:4}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

hould have, a German twin. Scanning English only is how eight German pages stayed on Mailchimp after the migration was declared finished.","weight":1.5},{"name":"4. Never edit code you cannot read","note":"Save a copy to disk, syntax-check it, hash-compare before writing. A blind edit took the sidebar down site-wide on 11 August 2026.","weight":1.5},{"name":"5. Say when something is wrong","note":"Refreshes have found live pages naming a bank that no longer exists and recommending the more expensive provider. Correcting it openly on the page is the house style, not quietly patching it.","weight":1.5}]},{"name":"Writing","items":[{"name":"No em-dashes","note":"Also no stray br, no empty p, no p inside style, one H1, no horizontal overflow."},{"name":"Fixed opening order","note":"Grey affiliate disclosure, then p.ihx-lede, then verdict box, then [lwptoc], then everything else."},{"name":"German uses Sie","note":"Swiss terminology: Wechselkursaufschlag, Bearbeitungsgebuehr, Freigrenze, Saeule 3a, Freizuegigkeit."},{"name":"Title 60, meta 140 to 160","note":"Numbers with context in titles. No stale year in title or meta."},{"name":"Ratings vocabulary is closed","note":"Five badges, four eyebrows. Nothing invented."},{"name":"Fine print is a shortcode default","note":"Never repeated in page copy."}]},{"name":"Palette","items":[{"name":"Indigo #1F0E45","note":"CTA cards, pill buttons, section headings, PDF bands."},{"name":"IH green #00DF56","note":"Accent rules, positive highlights, form submit buttons."},{"name":"Dark green #0A7C3C","note":"Green text on white. Raw #00DF56 fails contrast."},{"name":"Link blue #0D6EFF","note":"Inline links and source lines."},{"name":"Ink #1D1D1D","note":"Muted #5D5D66, line #E8E8EC, panel #F6F7F8."}]},{"name":"Owner","items":[{"name":"Concise and direct","note":"Limit unnecessary explanation. Numbered lists when asking what is next."},{"name":"Smallest safe change","note":"Just the line to add. Replacing all of it risks breaking it."},{ /* ---------- flatten ---------- */
const NODES=[], LINKS=[];
let uid=0;
const core={id:'core', kind:'core', name:'INVESTINGHERO.CH', dept:null,
  note:'Bilingual Swiss personal finance site. Target CHF 2,000/month, roughly 5,000 sessions/month. Everything on this map hangs off that number.',
  meta:['WordPress · Swyft · WPML','EN + DE, every page twice'], x:0,y:0,r:0,a:0};
NODES.push(core);

DATA.departments.forEach(d=>{
  const hub={id:'d_'+d.id, kind:'hub', name:d.name, dept:d.id, color:d.color, note:d.note||'', meta:[], count:0};
  NODES.push(hub); LINKS.push([core,hub]);
  d.groups.forEach(g=>{
    g.items.forEach(it=>{
      const n=Object.assign({id:'n'+(uid++), kind:'item', dept:d.id, color:d.color, group:g.name, hub:hub}, it);
      NODES.push(n); hub.count++;
    });
  });
});
const DEPTS = Object.fromEntries(DATA.departments.map(d=>[d.id,d]));

/* relations */
const IDX={}; NODES.forEach(n=>{ if(n.kind==='item') IDX[n.dept+'/'+n.name]=n; n.rel=[]; });
(DATA.relations||[]).forEach(([a,b])=>{ const A=IDX[a],B=IDX[b]; if(A&&B&&A!==B){A.rel.push(B);B.rel.push(A);} });

/* staleness for content items with a date */
const NOW = new Date('2026-08-14');
NODES.forEach(n=>{
  if(n.date){ n.years = (NOW - new Date(n.date))/(365.25*24*3600*1000); }
});

/* ---------- layout ---------- */
const state={l:'rings', spread:1, hidden:new Set(), k:1, x:0, y:0, size:'priority', hl:null, gapsOpen:false, focusDept:null};
const TAU=Math.PI*2;

function layout(){
  const s=state.spread;
  const allVisible = DATA.departments.filter(d=>!state.hidden.has(d.id));
  if(state.l==='grid'){ layoutGrid(allVisible); return; }
  const visible = allVisible.filter(d=>d.id!=='skills' && d.id!=='connectors');

  const counts = visible.map(d=>d.groups.reduce((a,g)=>a+g.items.length,0));
  const total = counts.reduce((a,b)=>a+b,0)||1;
  const gap = 0.055;                       // radians between departments
  const free = TAU - gap*visible.length;
  let ang = -Math.PI/2 + gap/2;

  const R_HUB=130*s, R0=205*s, DR=24*s, DOT=21*s;
  let maxR=R0;

  visible.forEach((d,i)=>{
    const span = free*(counts[i]/total);
    const mid = ang + span/2;
    const hub = NODES.find(n=>n.id==='d_'+d.id);
    hub.a=mid; hub.x=Math.cos(mid)*R_HUB; hub.y=Math.sin(mid)*R_HUB; hub.hidden=false;

    // sub-sector per group
    const gcounts=d.groups.map(g=>g.items.length);
    const gtot=gcounts.reduce((a,b)=>a+b,0)||1;
    let ga=ang;
    d.groups.forEach((g,gi)=>{
      const gspan = span*(gcounts[gi]/gtot);
      const pad = Math.min(gspan*0.12, 0.02);
      const a0=ga+pad, a1=ga+gspan-pad;
      let idx=0, ring=0, outer=R0;
      while(idx<g.items.length){
        const r = R0 + ring*DR * (state.l==='spiral'?1:1);
        const cap = Math.max(1, Math.floor((r*(a1-a0))/DOT));
        const take = Math.min(cap, g.items.length-idx);
        for(let j=0;j<take;j++){
          const t = take===1 ? (a0+a1)/2 : a0 + (a1-a0)*(j/(take-1));
          const tt = state.l==='spiral' ? t + ring*0.045 : t;
          const n=g.items[j+idx].__n;
          n.a=tt; n.x=Math.cos(tt)*r; n.y=Math.sin(tt)*r; n.hidden=false;
        }
        idx+=take; outer=r; ring++;
      }
      g.__label={a:(a0+a1)/2, r:outer+16*s};
      maxR=Math.max(maxR, outer);
      ga+=gspan;
    });
    ang+=span+gap;
  });

  // outer rings: skills then connectors, always full circle
  const orbits=[['skills', maxR+62*s],['connectors', maxR+128*s]];
  orbits.forEach(([id,R])=>{
    const d=DEPTS[id]; if(!d) return;
    const items=d.groups.flatMap(g=>g.items);
    const hidden=state.hidden.has(id);
    items.forEach((it,i)=>{
      const a=-Math.PI/2 + TAU*(i/items.length);
      it.__n.a=a; it.__n.x=Math.cos(a)*R; it.__n.y=Math.sin(a)*R; it.__n.orbit=R; it.__n.hidden=hidden;
    });
    const hub=NODES.find(n=>n.id==='d_'+id);
    hub.orbitR=R; hub.hidden=true; hub.x=0; hub.y=0; hub.a=-Math.PI/2;
    d.__orbit=R;
  });

  // hide the departments switched off
  DATA.departments.forEach(d=>{
    if(state.hidden.has(d.id)){
      d.groups.forEach(g=>{ g.items.forEach(it=>it.__n.hidden=true); g.__label=null; });
      const hub=NODES.find(n=>n.id==='d_'+d.id); hub.hidden=true;
    }
  });
  state.maxR=maxR;
}

function layoutGrid(visible){
  // simple readable columns, one per department
  const colW=150*state.spread, rowH=17*state.spread;
  let x=-(visible.length-1)*colW/2;
  let maxR=0;
  visible.forEach(d=>{
    const hub=NODES.find(n=>n.id==='d_'+d.id);
    hub.x=x; hub.y=-260*state.spread; hub.a=-Math.PI/2; hub.hidden=false;
    let y=-215*state.spread;
    d.groups.forEach(g=>{
      y+=rowH*1.4;
      g.__label={x:x,y:y-6};
      g.items.forEach((it,i)=>{
        const n=it.__n;
        n.x=x-((g.items.length>18)?((i%2)*15-7):0);
        n.y=y+ (g.items.length>18 ? Math.floor(i/2)*rowH*0.72 : i*rowH*0.72);
        n.a=0; n.hidden=false;
      });
      y += (g.items.length>18 ? Math.ceil(g.items.length/2) : g.items.length)*rowH*0.72;
      maxR=Math.max(maxR,Math.abs(y));
    });
    x+=colW;
  });
  DATA.departments.forEach(d=>{
    if(state.hidden.has(d.id)){
      d.groups.forEach(g=>{ g.items.forEach(it=>it.__n.hidden=true); g.__label=null; });
      NODES.find(n=>n.id==='d_'+d.id).hidden=true;
    }
  });
  state.maxR=maxR;
}

/* ---------- render ---------- */
const svg=document.getElementById('map');
const NS='http://www.w3.org/2000/svg';
function el(t,attrs){const e=document.createElementNS(NS,t);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
const gRoot=el('g'); svg.appendChild(gRoot);
const gRings=el('g'), gLinks=el('g'), gRel=el('g'), gLabels=el('g'), gNodes=el('g'), gHover=el('g');
[gRings,gLinks,gRel,gLabels,gNodes,gHover].forEach(g=>gRoot.appendChild(g));

// bind items to nodes
DATA.departments.forEach(d=>d.groups.forEach(g=>g.items.forEach(it=>{
  it.__n = NODES.find(n=>n.kind==='item' && n.dept===d.id && n.group===g.name && n.name===it.name);
})));

const SIZE_NOTE={
  priority:'Hand-set from the manual. Revenue pages, standing rules and blocking tasks read large.',
  age:'Last modified, capped at 6 years. Only content carries a date.',
  clicks:'No GSC export in the project files. Falling back to age.',
  words:'No word counts in the project files. Falling back to age.',
  flat:'Every node the same. Use it when position is the only thing you want to read.'
};
function radius(n){
  if(n.kind==='core') return 24;
  if(n.kind==='hub') return 7;
  const base = n.dept==='connectors'?7 : n.dept==='skills'?5.5 : 3.4;
  let m=state.size;
  if(m==='clicks'||m==='words') m='age';
  if(m==='flat') return base;
  if(m==='age') return n.years===undefined ? base*0.75 : 2.6+Math.min(n.years,6)*0.95;
  return n.weight ? 3.2+n.weight*1.5 : base;
}
function isStale(n){ return n.years!==undefined && n.years>2; }

const GAPMATCH={
  urgent:      n=>n.flag==='urgent',
  missing:     n=>(n.tags||[]).includes('gap'),
  revenue:     n=>n.group==='Revenue pages' && n.years>1.5,
  stale5:      n=>n.years>5,
  stale2:      n=>n.years>2,
  cruft:       n=>n.group==='Cruft' || n.group==='Author archives' || /uncategorized|my-account/.test(n.url||''),
  funnelrisk:  n=>(n.tags||[]).some(t=>['risk','defects','delete'].includes(t)) || /copies|never sent|course-waitlist|nofollow|honeypot/i.test(n.name),
  twins:       n=>/\/de\//.test(n.url||'') || /German|DE /.test(n.name) || (n.tags||[]).includes('DE'),
  nodata:      n=>false
};
function gapCount(id){ const f=GAPMATCH[id]; return f?NODES.filter(n=>n.kind==='item'&&f(n)).length:0; }
function matched(n){ return state.hl && GAPMATCH[state.hl] ? GAPMATCH[state.hl](n) : false; }

let sel=null, hov=null;
function render(){
  gRings.innerHTML=''; gLinks.innerHTML=''; gLabels.innerHTML=''; gNodes.innerHTML='';

  if(state.l!=='grid'){
    // hairline orbits
    const rs=[130*state.spread, state.maxR, DEPTS.skills.__orbit, DEPTS.connectors.__orbit];
    rs.forEach((r,i)=>{ if(!r) return;
      gRings.appendChild(el('circle',{cx:0,cy:0,r:r,fill:'none',stroke:'var(--hair)','stroke-width':i>1?.9:.6,
        'stroke-dasharray': i>1?'2 6':''}));
    });
    gRings.appendChild(el('circle',{cx:0,cy:0,r:60,fill:'none',stroke:'var(--hair2)','stroke-width':.8}));
  }

  // links core -> hubs
  NODES.filter(n=>n.kind==='hub' && !n.hidden).forEach(h=>{
    gLinks.appendChild(el('line',{x1:0,y1:0,x2:h.x,y2:h.y,stroke:h.color,'stroke-width':.7,opacity:.28}));
  });
  // hub -> group first node
  DATA.departments.forEach(d=>{
    if(state.hidden.has(d.id)||d.id==='skills'||d.id==='connectors') return;
    const hub=NODES.find(n=>n.id==='d_'+d.id);
    d.groups.forEach(g=>{
      const f=g.items[0] && g.items[0].__n; if(!f||f.hidden) return;
      gLinks.appendChild(el('line',{x1:hub.x,y1:hub.y,x2:f.x,y2:f.y,stroke:d.color,'stroke-width':.5,opacity:.16}));
    });
  });

  // group labels
  DATA.departments.forEach(d=>{
    if(state.hidden.has(d.id)) return;
    d.groups.forEach(g=>{
      const L=g.__label; if(!L) return;
      let t;
      if(state.l==='grid'){
        t=el('text',{x:L.x,y:L.y,class:'glabel','text-anchor':'middle'});
      }else{
        const deg=L.a*180/Math.PI;
        const flip = (deg>90||deg<-90);
        const x=Math.cos(L.a)*L.r, y=Math.sin(L.a)*L.r;
        t=el('text',{x:0,y:0,class:'glabel','text-anchor':flip?'end':'start',
          transform:`translate(${x},${y}) rotate(${flip?deg+180:deg})`, dy:'0.32em'});
      }
      t.textContent=g.name.toUpperCase();
      gLabels.appendChild(t);
    });
  });

  // department labels
  NODES.filter(n=>n.kind==='hub').forEach(h=>{
    const d=DEPTS[h.dept];
    let x,y;
    if(d.id==='skills'||d.id==='connectors'){
      if(!d.__orbit || state.l==='grid' || state.hidden.has(d.id)) return;
      x=0; y=-d.__orbit-16;
    } else {
      if(h.hidden) return;
      x=h.x*1.0; y=h.y*1.0-14;
    }
    const t=el('text',{x:x,y:y,class:'dlabel','text-anchor':'middle',fill:d.color,opacity:.85});
    t.textContent=d.name.toUpperCase(); gLabels.appendChild(t);
  });

  // relations of the pinned node
  gRel.innerHTML='';
  if(sel && !sel.hidden) drawRel(gRel, sel, .85);

  // nodes
  const drawn = NODES.filter(n=>!n.hidden && (n.kind!=='hub' || state.l!=='grid' || true));
  drawn.forEach(n=>{
    if(n.kind==='hub' && (n.dept==='skills'||n.dept==='connectors')) return;
    const g=el('g',{class:'node'});
    const r=radius(n);
    if(n.kind==='core'){
      g.appendChild(el('circle',{cx:0,cy:0,r:r+13,fill:'none',stroke:'var(--accent)',opacity:.35,'stroke-width':.8}));
      g.appendChild(el('circle',{cx:0,cy:0,r:r,fill:'var(--bg2)',stroke:'var(--accent)','stroke-width':1.2}));
      const t1=el('text',{x:0,y:52,class:'corelabel','text-anchor':'middle'}); t1.textContent='INVESTINGHERO';
      const t2=el('text',{x:0,y:66,class:'coresub','text-anchor':'middle'}); t2.textContent='CHF 2,000 / MONTH';
      g.appendChild(t1); g.appendChild(t2);
    } else {
      const hit = matched(n);
      const dim = state.hl && n.kind==='item' && !hit;
      const c=el('circle',{cx:n.x,cy:n.y,r:r,fill:n.color,opacity:dim?.07:(n.kind==='hub'?.95:.72)});
      if((n.tags||[]).includes('gap') && !dim){ c.setAttribute('fill','none'); c.setAttribute('stroke',n.color);
        c.setAttribute('stroke-width',1); c.setAttribute('stroke-dasharray','2 2'); }
      if(hit){ g.appendChild(el('circle',{cx:n.x,cy:n.y,r:r+6,fill:'none',stroke:'var(--accent)','stroke-width':.9,opacity:.85})); }
      if(n.kind==='hub') c.setAttribute('stroke','var(--bg)'), c.setAttribute('stroke-width',1.5);
      if(document.getElementById('stale').checked && isStale(n) && !dim){
        g.appendChild(el('circle',{cx:n.x,cy:n.y,r:r+3.6,fill:'none',stroke:n.color,opacity:.5,'stroke-width':.7,'stroke-dasharray':'1.5 2'}));
        c.setAttribute('opacity','.34');
      }
      if(n.flag==='urgent' && !dim && !hit){
        g.appendChild(el('circle',{cx:n.x,cy:n.y,r:r+5,fill:'none',stroke:'var(--accent)',opacity:.75,'stroke-width':.9}));
      }
      g.appendChild(c);
      if(sel===n){ g.appendChild(el('circle',{cx:n.x,cy:n.y,r:r+9,fill:'none',stroke:'var(--accent)','stroke-width':1.1})); }
      if(!dim && (document.getElementById('showNames').checked || n.dept==='connectors' || n.dept==='skills'
                  || state.focusDept===n.dept)){
        const deg=(n.a||0)*180/Math.PI, flip=(deg>90||deg<-90);
        let t;
        if(state.l==='grid'){
          t=el('text',{x:n.x+9,y:n.y,class:'hublabel',dy:'0.32em'});
        }else{
          t=el('text',{x:0,y:0,class:'hublabel','text-anchor':flip?'end':'start',
            transform:`translate(${n.x+Math.cos(n.a)*(r+5)},${n.y+Math.sin(n.a)*(r+5)}) rotate(${flip?deg+180:deg})`,dy:'0.32em'});
        }
        t.textContent=n.name; t.setAttribute('font-size', n.dept==='connectors'?'9.5':(n.dept==='skills'?'8.8':'8'));
        g.appendChild(t);
      }
    }
    g.addEventListener('click',e=>{e.stopPropagation(); if(n.kind==='hub'){focusDept(n.dept);} else {select(n);} });
    gNodes.appendChild(g);
  });
  applyTransform();
}

/* ---------- transform ---------- */
function applyTransform(){ gRoot.setAttribute('transform',`translate(${state.x},${state.y}) scale(${state.k})`); }
function fit(){
  const w=innerWidth,h=innerHeight;
  const R=(state.l==='grid'? state.maxR*1.15 : (DEPTS.connectors.__orbit||state.maxR)+70);
  state.k=Math.min(w,h)/(R*2.15); state.x=w/2; state.y=h/2; applyTransform();
}
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=Math.exp(-e.deltaY*0.0014), k=Math.min(6,Math.max(.15,state.k*f));
  state.x=e.clientX-(e.clientX-state.x)*(k/state.k);
  state.y=e.clientY-(e.clientY-state.y)*(k/state.k);
  state.k=k; applyTransform();
},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX-state.x,y:e.clientY-state.y};svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{
  if(drag){ state.x=e.clientX-drag.x; state.y=e.clientY-drag.y; applyTransform(); }
  onMove(e);
});
svg.addEventListener('pointerleave',()=>{gHover.innerHTML=''; if(!sel) readout.style.display='none';});
svg.addEventListener('dblclick',()=>{ state.focusDept=null; sel=null; render(); fit(); });
svg.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag')});
svg.addEventListener('click',()=>{ close(); sel=null; render(); });

/* ---------- relation drawing, hover, readout ---------- */
function curve(a,b){
  const cx=(a.x+b.x)/2*0.42, cy=(a.y+b.y)/2*0.42;
  return `M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`;
}
function drawRel(g, n, op){
  n.rel.forEach(m=>{
    if(m.hidden) return;
    g.appendChild(el('path',{d:curve(n,m),fill:'none',stroke:'var(--accent)','stroke-width':.8,opacity:op*.5}));
    g.appendChild(el('circle',{cx:m.x,cy:m.y,r:radius(m)+4,fill:'none',stroke:m.color,'stroke-width':.9,opacity:op}));
    const deg=(m.a||0)*180/Math.PI, flip=(deg>90||deg<-90), rr=radius(m)+7;
    const t=el('text',{x:0,y:0,class:'rellabel','text-anchor':flip?'end':'start',
      transform:`translate(${m.x+Math.cos(m.a)*rr},${m.y+Math.sin(m.a)*rr}) rotate(${flip?deg+180:deg})`,dy:'0.32em'});
    t.textContent=m.name; g.appendChild(t);
  });
}
const readout=document.getElementById('readout');
function toWorld(sx,sy){ return {x:(sx-state.x)/state.k, y:(sy-state.y)/state.k}; }
let raf=null, lastPt=null;
function onMove(e){
  lastPt={x:e.clientX,y:e.clientY};
  if(raf) return;
  raf=requestAnimationFrame(()=>{ raf=null; if(lastPt) hoverAt(lastPt.x,lastPt.y); });
}
function hoverAt(sx,sy){
  const w=toWorld(sx,sy);
  const cands=NODES.filter(n=>!n.hidden && n.kind!=='core');
  let best=null, bestD=1e9;
  const near=[];
  cands.forEach(n=>{
    const d=Math.hypot(n.x-w.x,n.y-w.y)*state.k;
    if(d<bestD && d < radius(n)*state.k+7){ best=n; bestD=d; }
    if(d<95) near.push([d,n]);
  });
  hov=best;
  gHover.innerHTML='';
  near.sort((a,b)=>a[0]-b[0]);
  near.slice(0,14).forEach(([d,n])=>{
    if(n===best || (best&&best.rel.includes(n))) return;
    if(state.focusDept===n.dept || document.getElementById('showNames').checked) return;
    const deg=(n.a||0)*180/Math.PI, flip=(deg>90||deg<-90), rr=radius(n)+5;
    const t=el('text',{x:0,y:0,class:'proxlabel','text-anchor':flip?'end':'start',opacity:Math.max(.25,1-d/95),
      transform:`translate(${n.x+Math.cos(n.a)*rr},${n.y+Math.sin(n.a)*rr}) rotate(${flip?deg+180:deg})`,dy:'0.32em'});
    t.textContent=n.name.length>44?n.name.slice(0,42)+'\u2026':n.name; gHover.appendChild(t);
  });
  if(best){
    gHover.appendChild(el('circle',{cx:best.x,cy:best.y,r:radius(best)+5,fill:'none',stroke:'var(--accent)','stroke-width':1}));
    if(best!==sel) drawRel(gHover,best,.6);
    showReadout(best);
  } else if(sel){ showReadout(sel); } else { readout.style.display='none'; }
  svg.style.cursor = best ? 'pointer' : (drag?'grabbing':'grab');
}
function showReadout(n){
  const d=DEPTS[n.dept]||{};
  const bits=[];
  if(n.type) bits.push(n.type);
  if(n.date) bits.push(n.date+' \u00b7 '+n.years.toFixed(1)+'y old');
  if(n.path) bits.push(n.path+n.name);
  if(n.url) bits.push(n.url.replace('https://investinghero.ch',''));
  if(n.kind==='hub') bits.push(n.count+' items');
  (n.tags||[]).forEach(t=>bits.push(t.toUpperCase()));
  if(isStale(n)) bits.push('STALE');
  if(n.flag) bits.push(n.flag.toUpperCase());
  if(n.rel.length) bits.push('<b class="hot">'+n.rel.length+' linked</b>');
  readout.innerHTML =
    `<div class="rname">${esc(n.name)}<span class="rpath">${esc([d.name,n.group].filter(Boolean).join(' / '))}</span></div>`+
    (n.note?`<p class="rnote">${esc(n.note)}</p>`:'')+
    (bits.length?`<div class="rbits">${bits.join(' &nbsp;\u00b7&nbsp; ')}</div>`:'');
  readout.style.display='block';
}

/* ---------- tooltip + panel ---------- */
const tip=document.getElementById('tip');
function showTip(e,n){
  hov=n;
  const d=DEPTS[n.dept];
  tip.innerHTML=`<b>${esc(n.name)}</b><span class="s">${esc([d?d.name:'CORE',n.group||''].filter(Boolean).join(' · '))}</span>`;
  tip.style.display='block'; moveTip(e);
}
function moveTip(e){ tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px'; }
function hideTip(){ tip.style.display='none'; }
const panel=document.getElementById('panel'), pbody=document.getElementById('panelBody');
document.getElementById('close').addEventListener('click',close);
function close(){ panel.style.display='none'; state.gapsOpen=false; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function open(n){
  const d=DEPTS[n.dept];
  let h='';
  if(state.gapsOpen) h+='<button class="back">&larr; Gaps</button>';
  h+=`<div class="eyebrow">${esc([d?d.name:'CORE', n.group||''].filter(Boolean).join(' &middot; '))}</div>`;
  h+=`<h2>${esc(n.name)}</h2>`;
  const meta=[];
  if(n.url) meta.push(`<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.url)} &rarr;</a>`);
  if(n.path) meta.push(esc(n.path));
  if(n.date) meta.push(`last modified ${esc(n.date)}${n.years!==undefined?` &middot; ${n.years.toFixed(1)} yrs`:''}`);
  if(n.type) meta.push('type: '+esc(n.type));
  if(n.kind==='hub') meta.push(n.count+' items');
  if(meta.length) h+=`<div class="meta">${meta.join('<br>')}</div>`;
  if(n.note) h+=`<p class="note">${esc(n.note)}</p>`;
  if(n.meta && n.meta.length) h+=`<hr class="sep"><div class="meta">${n.meta.map(esc).join('<br>')}</div>`;
  const tags=[];
  if(isStale(n)) tags.push('stale');
  if(n.flag) tags.push(n.flag);
  (n.tags||[]).forEach(t=>tags.push(t));
  if(tags.length) h+=`<div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`;
  if(n.rel && n.rel.length){
    h+=`<hr class="sep"><div class="eyebrow">Linked &middot; ${n.rel.length}</div><div>`;
    n.rel.forEach(m=>{ h+=`<button class="relchip" data-rel="${NODES.indexOf(m)}"><span class="sw" style="background:${m.color}"></span>${esc(m.name)}</button>`; });
    h+='</div>';
  }
  if(n.kind==='item'){
    const sib=NODES.filter(x=>x.kind==='item'&&x.dept===n.dept&&x.group===n.group);
    const i=sib.indexOf(n);
    h+=`<div class="sibnav">`+
       `<button data-sib="${NODES.indexOf(sib[(i-1+sib.length)%sib.length])}">&larr; prev</button>`+
       `<button data-sib="${NODES.indexOf(sib[(i+1)%sib.length])}">next &rarr;</button>`+
       `<span style="font-family:var(--mono);font-size:9px;color:var(--muted2);align-self:center">${i+1} / ${sib.length} in ${esc(n.group)}</span></div>`;
  }
  pbody.innerHTML=h; panel.style.display='block';
}
function renderGaps(){
  state.gapsOpen=true;
  let h='<div class="eyebrow">Where the work is not</div><h2>Gaps</h2>';
  h+='<p class="note" style="margin-bottom:6px">Computed from the map. Click one to light up the nodes it refers to.</p>';
  DATA.gaps.forEach(g=>{
    const c=gapCount(g.id);
    h+=`<button class="gap ${state.hl===g.id?'on':''}" data-g="${g.id}"><h3>${esc(g.title)}<span class="n">${c?c:'&mdash;'}</span></h3>`+
       `<p class="why">${esc(g.why)}</p><p class="what">${esc(g.what)}</p></button>`;
  });
  pbody.innerHTML=h; panel.style.display='block';
}
pbody.addEventListener('click',e=>{
  const b=e.target.closest('.gap');
  if(b){ state.hl = (state.hl===b.dataset.g)?null:b.dataset.g; render(); renderGaps(); return; }
  if(e.target.closest('.back')){ renderGaps(); return; }
  const rc=e.target.closest('.relchip'); if(rc){ const m=NODES[+rc.dataset.rel]; sel=m; render(); open(m); showReadout(m); return; }
  const sb=e.target.closest('[data-sib]'); if(sb){ const m=NODES[+sb.dataset.sib]; sel=m; render(); open(m); showReadout(m); }
});
function select(n){ sel=n; render(); open(n); showReadout(n); }
function focusDept(id){
  state.focusDept = state.focusDept===id ? null : id;
  const hub=NODES.find(x=>x.id==='d_'+id);
  render();
  if(state.focusDept){
    const R=(state.maxR+140)/2;
    state.k=Math.min(3.2, Math.min(innerWidth,innerHeight)/(R*1.6));
    const cx=Math.cos(hub.a)*(state.maxR*0.62), cy=Math.sin(hub.a)*(state.maxR*0.62);
    state.x=innerWidth/2-cx*state.k; state.y=innerHeight/2-cy*state.k; applyTransform();
    open(hub);
  } else fit();
}
function focusNode(n){
  sel=n; render();
  state.k=Math.max(state.k,1.4);
  state.x=innerWidth/2-n.x*state.k; state.y=innerHeight/2-n.y*state.k;
  applyTransform(); open(n); showReadout(n);
}

/* ---------- search ---------- */
const q=document.getElementById('q'), results=document.getElementById('results');
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase();
  if(!v){ results.style.display='none'; results.innerHTML=''; return; }
  const hits=NODES.filter(n=>n.kind!=='core' && !n.hidden &&
    ((n.name||'')+' '+(n.note||'')+' '+(n.url||'')+' '+(n.group||'')).toLowerCase().includes(v)).slice(0,40);
  results.innerHTML = hits.length ? hits.map((n,i)=>
    `<button data-i="${NODES.indexOf(n)}">${esc(n.name)}<span class="p"><br>${esc((DEPTS[n.dept]||{}).name||'')} ${esc(n.group||'')}</span></button>`).join('')
    : `<button disabled>no match</button>`;
  results.style.display='block';
});
results.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||!b.dataset.i) return;
  focusNode(NODES[+b.dataset.i]);
});

/* ---------- controls ---------- */
const chips=document.getElementById('chips');
DATA.departments.forEach(d=>{
  const b=document.createElement('button'); b.className='chip'; b.dataset.d=d.id;
  const n=d.groups.reduce((a,g)=>a+g.items.length,0);
  b.innerHTML=`<span class="sw" style="background:${d.color}"></span>${esc(d.name)}<span class="ct">${n}</span>`;
  b.addEventListener('click',()=>{
    state.hidden.has(d.id)?state.hidden.delete(d.id):state.hidden.add(d.id);
    b.classList.toggle('off'); layout(); render();
  });
  chips.appendChild(b);
});
document.getElementById('layouts').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  [...e.currentTarget.children].forEach(c=>c.classList.remove('on')); b.classList.add('on');
  state.l=b.dataset.l; layout(); render(); fit();
});
document.getElementById('sizes').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  [...e.currentTarget.children].forEach(c=>c.classList.remove('on')); b.classList.add('on');
  state.size=b.dataset.s; document.getElementById('sizeNote').textContent=SIZE_NOTE[state.size]; render();
});
document.getElementById('gapsBtn').addEventListener('click',()=>{
  if(state.gapsOpen){ close(); state.hl=null; render(); } else { renderGaps(); }
});
document.getElementById('spread').addEventListener('input',e=>{ state.spread=+e.target.value/100; layout(); render(); });
document.getElementById('showNames').addEventListener('change',render);
document.getElementById('stale').addEventListener('change',render);
document.getElementById('fit').addEventListener('click',()=>{layout();render();fit();});
document.getElementById('theme').addEventListener('click',e=>{
  document.body.classList.toggle('light');
  e.target.textContent=document.body.classList.contains('light')?'Dark':'Light';
});
addEventListener('resize',fit);
addEventListener('keydown',e=>{ if(e.key==='Escape'){close(); state.hl=null; sel=null; state.focusDept=null; readout.style.display='none'; render(); q.value=''; results.style.display='none';} if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus();} });

document.getElementById('sizeNote').textContent=SIZE_NOTE.priority;
panel.addEventListener('click',e=>e.stopPropagation());
layout(); render(); fit();
</script>
</body>
</html>
